name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./internal/...
      - run: go test ./internal/...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: frontend
      - run: go build ./...
